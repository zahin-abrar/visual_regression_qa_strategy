[pytest]
testpaths = qa_visual/unit_tests qa_visual/tests
pythonpath = qa_visual
# testpaths applies only when pytest runs from this directory. From qa_visual/ pytest would
# recurse through everything there (including generated artifacts/); this keeps discovery
# to tests/ and unit_tests/. Setting norecursedirs replaces pytest's defaults, so repeat them.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} artifacts baselines demo_assets visualqa
markers =
    visual: Android Appium screenshot regression test requiring emulator, Metro and Appium
    unit: Python unit test; no emulator or Appium server required
    qa_scenario(id): QA fixture scenario the test cold-launches (long_headline, breaking_news, dark_article, no_image, empty_feed)
    intentional_failure: deliberately FAILING reference-mismatch demo; excluded by default, run only with -m intentional_failure
addopts = -ra -m "not intentional_failure"
