name: Android debug build

# Stage 1 CI: build the Android debug APK from committed files only.
# Does NOT start an emulator, run Appium or visual tests, or check golden references.
# Does NOT use EAS, Expo/Play credentials or any repository secret.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      # Version is taken from "packageManager" in app/package.json (pnpm 12.11.2).
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json

      - name: Set up Node (app/.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Show tool versions
        run: |
          echo "runner: $ImageOS $ImageVersion"
          node --version
          pnpm --version
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls "${ANDROID_HOME:-/nonexistent}/platforms" "${ANDROID_HOME:-/nonexistent}/build-tools" "${ANDROID_HOME:-/nonexistent}/ndk" 2>&1 || true

      - name: "Step 1/4: install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Step 2/4: Expo prebuild (Android)"
        run: pnpm exec expo prebuild --platform android --no-install

      - name: "Step 3/4: Gradle assembleDebug (x86_64)"
        working-directory: app/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon --console=plain

      - name: Locate debug APK
        id: apk
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Expected APK not found: app/$apk"
            ls -R android/app/build/outputs 2>&1 | head -50 || true
            exit 1
          fi
          ls -l "$apk"
          sha256sum "$apk"

      - name: "Step 4/4: upload debug APK"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk-x86_64
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
